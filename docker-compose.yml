services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: grooveshare-server
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: grooveshare-client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - server

volumes:
  client_node_modules:
  server_node_modules: